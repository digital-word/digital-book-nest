query CountNotes @auth(level: NO_ACCESS) {
  notes(where: { isDeleted: { eq: false } }) {
    _count
  }
}

fragment NoteListFields on Note {
  id
  title
  isFavorite
  status
  permissions
  version
  createdAt
  updatedAt
  tags: tags_via_NoteTag {
    name
  }
  categories: categories_via_NoteCategory {
    name
  }
}

query ListNotesByUpdatedAt($limit: Int, $offset: Int, $order: OrderDirection)
@auth(level: NO_ACCESS) {
  notes(
    limit: $limit
    offset: $offset
    where: { isDeleted: { eq: false } }
    orderBy: [{ updatedAt: $order }]
  ) {
    ...NoteListFields
  }
}

query ListNotesByCreatedAt($limit: Int, $offset: Int, $order: OrderDirection)
@auth(level: NO_ACCESS) {
  notes(
    limit: $limit
    offset: $offset
    where: { isDeleted: { eq: false } }
    orderBy: [{ createdAt: $order }]
  ) {
    ...NoteListFields
  }
}

query ListNotesByTitle($limit: Int, $offset: Int, $order: OrderDirection)
@auth(level: NO_ACCESS) {
  notes(
    limit: $limit
    offset: $offset
    where: { isDeleted: { eq: false } }
    orderBy: [{ title: $order }]
  ) {
    ...NoteListFields
  }
}

query NoteDetail($id: UUID) @auth(level: NO_ACCESS) {
  notes(where: { id: { eq: $id }, isDeleted: { eq: false } }) {
    id
    title
    content
    searchableText
    isFavorite
    status
    permissions
    version
    createdAt
    updatedAt
    tags: tags_via_NoteTag {
      name
    }
    categories: categories_via_NoteCategory {
      name
    }
  }
}
