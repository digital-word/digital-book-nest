query ListNotes($limit: Int, $offset: Int) @auth(level: NO_ACCESS) {
  notes(
    limit: $limit
    offset: $offset
    where: { isDeleted: { eq: false } }
    orderBy: [{ updatedAt: DESC }]
  ) {
    id
    title
    isFavorite
    status
    permissions
    version
    createdAt
    updatedAt
    tags: tags_via_NoteTag { name }
    categories: categories_via_NoteCategory { name }
  }
}

query NoteDetail($id: UUID) @auth(level: NO_ACCESS) {
  notes(
    where: { id: { eq: $id }, isDeleted: { eq: false } }
  ) {
    id
    title
    content
    searchableText
    isFavorite
    status
    permissions
    version
    createdAt
    updatedAt
    tags: tags_via_NoteTag { name }
    categories: categories_via_NoteCategory { name }
  }
}